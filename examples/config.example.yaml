# ==============================================================================
# Example configuration for ai-api-sdk
# ==============================================================================

# Credential store configuration (file-based JSON).
auth:
  store:
    type: file
    path: "../credentials.json"
    encrypted: false
    encryption:
      enabled: false
      algo: "AES-256-GCM"
      kdf: "scrypt"
      kdf_params:
        n: 32768
        r: 8
        p: 1
        key_len: 32
      master_key_env: "AI_SDK_MASTER_KEY"
      # master_key_file: "/path/to/master.key"

# Providers (one entry per endpoint).
providers:
  # Local vLLM (OpenAI-compatible)
  - name: "vllm_local"
    type: "openai_compat"
    base_url: "http://10.6.193.48:30090/v1"
    auth_ref: "vllm_bearer"

  - name: "dashscope"
    type: "dashscope"
    auth_ref: "dashscope_key"

  # 阿里百炼应用接入（Responses API，同步文本对话）
  - name: "bailian_app"
    type: "bailian_app"
    # 将 <YOUR_APP_ID> 替换为百炼应用 ID
    base_url: "https://dashscope.aliyuncs.com/api/v2/apps/agent/<YOUR_APP_ID>/compatible-mode/v1"
    auth_ref: "bailian_app_key"
    # 可选：追加业务参数
    # extra_body:
    #   user: "demo-user"

  # 火山引擎方舟 (Volcengine Ark)
  - name: "volcengine"
    type: "volcengine"
    auth_ref: "volcengine_key"

  # OpenAI cloud
  - name: "openai_cloud"
    type: "openai"
    auth_ref: "openai_key"

  # OpenAI cloud (alias for simple examples)
  - name: "openai"
    type: "openai"
    auth_ref: "openai_key"

  # Anthropic Claude
  - name: "claude_cloud"
    type: "claude"
    auth_ref: "claude_key"

  # Google Gemini
  - name: "gemini_cloud"
    type: "gemini"
    auth_ref: "gemini_key"

  # Optional OpenAI-compatible gateway
  - name: "gateway"
    type: "openai_compat"
    base_url: "https://your-gateway.example.com/v1"
    path: "/chat/completions"
    auth_ref: "gateway_token"
    headers:
      X-Project: "demo"
    extra_body:
      group: "default"

  # Optional DeepSeek
  - name: "deepseek_cloud"
    type: "deepseek"
    auth_ref: "deepseek_key"

  # 百度千帆（文心一言 ERNIE）
  - name: "qianfan"
    type: "qianfan"
    auth_ref: "qianfan_key"

  # Optional Dify
  - name: "dify"
    type: "dify"
    base_url: "https://adaidify.sangfor.com/v1"  # 或自建 Dify 地址
    auth_ref: "dify_key"
    # extra_body:  # 可选：注入变量
    #   inputs:
    #     var1: "value1"
    #   user: "custom-user-id"

  # FastGPT (local_history mode: set via WithConversationMode() when creating session)
  - name: "fastgpt_local"
    type: "fastgpt"
    base_url: "https://api.fastgpt.in"
    path: "/api/v1/chat/completions"
    auth_ref: "fastgpt_key"
    extra_body:
      detail: true
      variables:
        team: "demo"
        channel: "examples"

  # FastGPT (remote_session mode: set via WithConversationMode() when creating session)
  - name: "fastgpt_remote"
    type: "fastgpt"
    base_url: "https://api.fastgpt.in"
    path: "/api/v1/chat/completions"
    auth_ref: "fastgpt_key"
    extra_body:
      detail: true
      variables:
        team: "demo"
        channel: "examples"

  # RAGFlow (chat_id is required in extra_body, it identifies the Chat Assistant)
  - name: "ragflow"
    type: "ragflow"
    base_url: "http://ragflow.example.com"  # 自建 RAGFlow 地址
    auth_ref: "ragflow_key"
    extra_body:
      chat_id: "your-chat-assistant-id"  # 必填：RAGFlow Chat Assistant ID

# Credentials (referenced by providers[].auth_ref).
credentials:
  - id: "none"
    auth_type: "none"

  - id: "vllm_bearer"
    provider: "openai_compat"
    auth_type: "bearer_token"
    access_token: "sk-TOKEN"

  - id: "dashscope_key"
    provider: "dashscope"
    auth_type: "bearer_token"
    access_token: "sk-10ed349b0ea34sdss"

  - id: "bailian_app_key"
    provider: "bailian_app"
    auth_type: "bearer_token"
    access_token: "sk-REPLACE"

  - id: "openai_key"
    provider: "openai"
    auth_type: "bearer_token"
    access_token: "sddssds"

  - id: "claude_key"
    provider: "claude"
    auth_type: "api_key"
    api_key: "sk-ant-REPLACE"

  - id: "gemini_key"
    provider: "gemini"
    auth_type: "api_key"
    api_key: "AIza-REPLACE"

  - id: "gateway_token"
    provider: "openai_compat"
    auth_type: "bearer_token"
    access_token: "REPLACE_ME"

  - id: "deepseek_key"
    provider: "deepseek"
    auth_type: "bearer_token"
    access_token: "sk-REPLACE"

  - id: "volcengine_key"
    provider: "volcengine"
    auth_type: "bearer_token"
    access_token: "your-ark-api-key"

  - id: "qianfan_key"
    provider: "qianfan"
    auth_type: "bearer_token"
    access_token: "your-qianfan-api-key"

  - id: "dify_key"
    provider: "dify"
    auth_type: "api_key"
    api_key: "app-59zRGqk6BMwGkKz3HWLIezvi"

  - id: "fastgpt_key"
    provider: "fastgpt"
    auth_type: "api_key"
    api_key: "fastgpt-TOKEN"

  - id: "ragflow_key"
    provider: "ragflow"
    auth_type: "api_key"
    api_key: "ragflow-TOKEN"
