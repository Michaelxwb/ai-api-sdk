# ==============================================================================
# Example configuration for ai-api-sdk
# ==============================================================================

# Credential store configuration (file-based JSON).
auth:
  store:
    type: file
    path: "../credentials.json"
    encrypted: false
    encryption:
      enabled: false
      algo: "AES-256-GCM"
      kdf: "scrypt"
      kdf_params:
        n: 32768
        r: 8
        p: 1
        key_len: 32
      master_key_env: "AI_SDK_MASTER_KEY"
      # master_key_file: "/path/to/master.key"

# Providers (one entry per endpoint).
providers:
  # Local vLLM (OpenAI-compatible)
  - name: "vllm_local"
    type: "openai_compat"
    base_url: "https://ollama.iepose.cn/v1"
    auth_ref: "vllm_bearer"

  # OpenAI cloud
  - name: "openai_cloud"
    type: "openai"
    auth_ref: "openai_key"

  # Anthropic Claude
  - name: "claude_cloud"
    type: "claude"
    auth_ref: "claude_key"

  # Google Gemini
  - name: "gemini_cloud"
    type: "gemini"
    auth_ref: "gemini_key"

  # Optional OpenAI-compatible gateway
  - name: "gateway"
    type: "openai_compat"
    base_url: "https://your-gateway.example.com/v1"
    path: "/chat/completions"
    auth_ref: "gateway_token"
    headers:
      X-Project: "demo"
    extra_body:
      group: "default"

  # Optional DeepSeek
  - name: "deepseek_cloud"
    type: "deepseek"
    auth_ref: "deepseek_key"

  # Optional Dify
  - name: "dify"
    type: "dify"
    base_url: "https://api.dify.ai/v1"  # 或自建 Dify 地址
    auth_ref: "dify_key"
    # extra_body:  # 可选：注入变量
    #   inputs:
    #     var1: "value1"
    #   user: "custom-user-id"

# Credentials (referenced by providers[].auth_ref).
credentials:
  - id: "none"
    auth_type: "none"

  - id: "vllm_bearer"
    provider: "openai_compat"
    auth_type: "bearer_token"
    access_token: "SK-TOKEN"

  - id: "openai_key"
    provider: "openai"
    auth_type: "bearer_token"
    access_token: "sk-REPLACE"

  - id: "claude_key"
    provider: "claude"
    auth_type: "api_key"
    api_key: "sk-ant-REPLACE"

  - id: "gemini_key"
    provider: "gemini"
    auth_type: "api_key"
    api_key: "AIza-REPLACE"

  - id: "gateway_token"
    provider: "openai_compat"
    auth_type: "bearer_token"
    access_token: "REPLACE_ME"

  - id: "deepseek_key"
    provider: "deepseek"
    auth_type: "bearer_token"
    access_token: "sk-REPLACE"

  - id: "dify_key"
    provider: "dify"
    auth_type: "api_key"
    api_key: "app-REPLACE"
