validators:
    - name: "Go 编译检查"
      trigger: "**/*.go"
      command: "go build ./..."
      timeout: 60000
      on_fail: "编译失败，检查语法和依赖"

    - name: "Go 单元测试"
      trigger: "**/*.go"
      command: "go test ./test/... -timeout 60s"
      timeout: 120000
      on_fail: "测试失败，检查断言和 mock 是否需要更新"

    - name: "Go vet 静态分析"
      trigger: "**/*.go"
      command: "go vet ./..."
      timeout: 30000
      on_fail: "go vet 发现问题，检查代码规范"
